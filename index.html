<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA VAULT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: #0b0f19;
            --border-color: #00ffcc55;
            --neon-cyan: #00ffcc;
            --neon-pink: #ff007f;
            --neon-yellow: #f39c12;
            --text-main: #e0e0e0;
            --text-dim: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 10%, #00ffcc11 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, #ff007f11 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Stats Panel */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            text-align: center;
            border-radius: 6px;
        }

        .stat-card h3 {
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
        }

        .stat-card p {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Form Container */
        .form-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-panel h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-pink);
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background: #05070c;
            border: 1px solid #223a4a;
            color: var(--text-main);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
        }

        .btn-add {
            flex: 1;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .btn-add:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 12px 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            margin-top: 5px;
            display: none;
        }

        .btn-cancel:hover {
            background: var(--neon-pink);
            color: #fff;
        }

        /* Controls */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--panel-bg);
            border: 1px solid #223a4a;
            color: var(--text-dim);
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 255, 204, 0.05);
        }

        .search-box {
            flex: 1;
            max-width: 300px;
        }

        /* Movie Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-cyan);
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .fav-btn.active {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .movie-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #111;
        }

        .movie-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .type-badge {
            font-size: 0.7rem;
            background: #223a4a;
            color: var(--neon-cyan);
            padding: 2px 6px;
            border-radius: 3px;
            align-self: flex-start;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .movie-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .ratings-row {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .rating-imdb { color: #f3ce13; font-weight: bold; }
        .rating-my { color: var(--neon-cyan); font-weight: bold; }

        .status-badge {
            display: block;
            padding: 4px;
            font-size: 0.75rem;
            border-radius: 3px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .status-unwatched {
            background: rgba(243, 156, 18, 0.15);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
        }

        .status-watched {
            background: rgba(0, 255, 204, 0.15);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-row {
            display: flex;
            gap: 6px;
        }

        .btn-watch {
            display: block;
            text-align: center;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px;
            font-size: 0.8rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-watch:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        .btn-toggle {
            flex: 1;
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-main);
            padding: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-toggle:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .btn-edit {
            background: transparent;
            border: 1px solid var(--neon-yellow);
            color: var(--neon-yellow);
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .btn-edit:hover {
            background: var(--neon-yellow);
            color: #000;
        }

        .btn-del {
            background: transparent;
            border: 1px solid rgba(255, 0, 127, 0.5);
            color: var(--neon-pink);
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .btn-del:hover {
            background: var(--neon-pink);
            color: #fff;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>// MEDIA VAULT</h1>
        <p>Movies & TV Series Collection Tracker</p>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3 id="stat-total">0</h3>
            <p>Total Items</p>
        </div>
        <div class="stat-card">
            <h3 id="stat-unwatched">0</h3>
            <p>To Watch</p>
        </div>
        <div class="stat-card">
            <h3 id="stat-watched">0</h3>
            <p>Watched</p>
        </div>
        <div class="stat-card">
            <h3 id="stat-favs">0</h3>
            <p>Favorites ❤️</p>
        </div>
    </div>

    <!-- Form -->
    <div class="form-panel">
        <h2 id="form-title">+ ADD NEW ENTRY</h2>
        <form id="movie-form" class="form-grid">
            <input type="hidden" id="edit-id">
            <select id="type" onchange="toggleSeasonField()">
                <option value="Movie">Movie</option>
                <option value="TV Series">TV Series</option>
            </select>
            <input type="text" id="title" placeholder="Title Name *" required>
            <input type="text" id="season" placeholder="Season (e.g. Season 1)" style="display:none;">
            <input type="text" id="year" placeholder="Year (e.g. 2024)">
            <input type="text" id="genre" placeholder="Genre (Action, Sci-Fi)">
            <input type="text" id="imdb" placeholder="IMDb Rating (e.g. 8.8)">
            <input type="text" id="myrating" placeholder="My Rating (e.g. 9/10)">
            <input type="url" id="poster" placeholder="Poster Image URL *" required>
            <input type="url" id="watchUrl" placeholder="Watch Link URL (Streaming/Site)">
            
            <select id="status">
                <option value="Unwatched">Status: Unwatched</option>
                <option value="Watched">Status: Watched</option>
            </select>

            <select id="favorite">
                <option value="no">Favorite: No</option>
                <option value="yes">Favorite: Yes ❤️</option>
            </select>

            <div class="form-actions">
                <button type="submit" id="btn-submit" class="btn-add">ADD TO VAULT</button>
                <button type="button" id="btn-cancel" class="btn-cancel" onclick="resetForm()">CANCEL</button>
            </div>
        </form>
    </div>

    <!-- Controls & Filters -->
    <div class="controls-bar">
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="setFilter('all')">All</button>
            <button class="tab-btn" onclick="setFilter('Movie')">Movies</button>
            <button class="tab-btn" onclick="setFilter('TV Series')">TV Series</button>
            <button class="tab-btn" onclick="setFilter('Unwatched')">To Watch</button>
            <button class="tab-btn" onclick="setFilter('Watched')">Watched</button>
            <button class="tab-btn" onclick="setFilter('fav')">Favorites ❤️</button>
        </div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Search title or genre..." oninput="renderMovies()">
        </div>
    </div>

    <!-- Movie Grid -->
    <div id="movie-grid" class="movie-grid"></div>
</div>

<script>
    let movies = JSON.parse(localStorage.getItem('media_vault_v3')) || [];
    let currentFilter = 'all';

    const form = document.getElementById('movie-form');
    const grid = document.getElementById('movie-grid');

    function toggleSeasonField() {
        const type = document.getElementById('type').value;
        const seasonInput = document.getElementById('season');
        if (type === 'TV Series') {
            seasonInput.style.display = 'block';
            seasonInput.required = true;
        } else {
            seasonInput.style.display = 'none';
            seasonInput.required = false;
            seasonInput.value = '';
        }
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const editId = document.getElementById('edit-id').value;
        const type = document.getElementById('type').value;
        const title = document.getElementById('title').value;
        const season = document.getElementById('season').value;

        if (editId) {
            // Edit existing item
            const index = movies.findIndex(m => m.id == editId);
            if (index !== -1) {
                movies[index] = {
                    ...movies[index],
                    type: type,
                    title: title,
                    season: type === 'TV Series' ? (season || 'Season 1') : '',
                    year: document.getElementById('year').value || 'N/A',
                    genre: document.getElementById('genre').value || 'N/A',
                    imdb: document.getElementById('imdb').value || 'N/A',
                    myrating: document.getElementById('myrating').value || 'N/A',
                    poster: document.getElementById('poster').value,
                    watchUrl: document.getElementById('watchUrl').value || '',
                    status: document.getElementById('status').value,
                    favorite: document.getElementById('favorite').value === 'yes'
                };
            }
        } else {
            // Add new item
            const newItem = {
                id: Date.now(),
                type: type,
                title: title,
                season: type === 'TV Series' ? (season || 'Season 1') : '',
                year: document.getElementById('year').value || 'N/A',
                genre: document.getElementById('genre').value || 'N/A',
                imdb: document.getElementById('imdb').value || 'N/A',
                myrating: document.getElementById('myrating').value || 'N/A',
                poster: document.getElementById('poster').value,
                watchUrl: document.getElementById('watchUrl').value || '',
                status: document.getElementById('status').value,
                favorite: document.getElementById('favorite').value === 'yes'
            };
            movies.push(newItem);
        }

        saveAndRender();
        resetForm();
    });

    function editMovie(id) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;

        document.getElementById('edit-id').value = movie.id;
        document.getElementById('type').value = movie.type;
        toggleSeasonField();
        document.getElementById('title').value = movie.title;
        if (movie.type === 'TV Series') document.getElementById('season').value = movie.season;
        document.getElementById('year').value = movie.year !== 'N/A' ? movie.year : '';
        document.getElementById('genre').value = movie.genre !== 'N/A' ? movie.genre : '';
        document.getElementById('imdb').value = movie.imdb !== 'N/A' ? movie.imdb : '';
        document.getElementById('myrating').value = movie.myrating !== 'N/A' ? movie.myrating : '';
        document.getElementById('poster').value = movie.poster;
        document.getElementById('watchUrl').value = movie.watchUrl || '';
        document.getElementById('status').value = movie.status;
        document.getElementById('favorite').value = movie.favorite ? 'yes' : 'no';

        document.getElementById('form-title').textContent = '✏️ EDIT ENTRY';
        document.getElementById('btn-submit').textContent = 'UPDATE VAULT';
        document.getElementById('btn-cancel').style.display = 'block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        form.reset();
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').textContent = '+ ADD NEW ENTRY';
        document.getElementById('btn-submit').textContent = 'ADD TO VAULT';
        document.getElementById('btn-cancel').style.display = 'none';
        toggleSeasonField();
    }

    function saveAndRender() {
        localStorage.setItem('media_vault_v3', JSON.stringify(movies));
        updateStats();
        renderMovies();
    }

    function deleteMovie(id) {
        movies = movies.filter(m => m.id !== id);
        saveAndRender();
    }

    function toggleStatus(id) {
        const movie = movies.find(m => m.id === id);
        if (movie) {
            movie.status = movie.status === 'Watched' ? 'Unwatched' : 'Watched';
            saveAndRender();
        }
    }

    function toggleFav(id) {
        const movie = movies.find(m => m.id === id);
        if (movie) {
            movie.favorite = !movie.favorite;
            saveAndRender();
        }
    }

    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderMovies();
    }

    function updateStats() {
        document.getElementById('stat-total').textContent = movies.length;
        document.getElementById('stat-unwatched').textContent = movies.filter(m => m.status === 'Unwatched').length;
        document.getElementById('stat-watched').textContent = movies.filter(m => m.status === 'Watched').length;
        document.getElementById('stat-favs').textContent = movies.filter(m => m.favorite).length;
    }

    function renderMovies() {
        const searchVal = document.getElementById('search').value.toLowerCase();
        
        let filtered = movies.filter(m => {
            const matchesSearch = m.title.toLowerCase().includes(searchVal) || m.genre.toLowerCase().includes(searchVal);
            
            let matchesTab = true;
            if (currentFilter === 'Movie') matchesTab = m.type === 'Movie';
            if (currentFilter === 'TV Series') matchesTab = m.type === 'TV Series';
            if (currentFilter === 'Unwatched') matchesTab = m.status === 'Unwatched';
            if (currentFilter === 'Watched') matchesTab = m.status === 'Watched';
            if (currentFilter === 'fav') matchesTab = m.favorite === true;

            return matchesSearch && matchesTab;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-msg">// NO DATA FOUND //</div>`;
            return;
        }

        grid.innerHTML = filtered.map(m => `
            <div class="movie-card">
                <button class="fav-btn ${m.favorite ? 'active' : ''}" onclick="toggleFav(${m.id})">♥</button>
                <img src="${m.poster}" alt="${m.title}" class="movie-poster" onerror="this.src='https://via.placeholder.com/240x280?text=NO+POSTER'">
                <div class="movie-info">
                    <span class="type-badge">${m.type} ${m.season ? '• ' + m.season : ''}</span>
                    <h3 class="movie-title" title="${m.title}">${m.title}</h3>
                    <div class="movie-meta">
                        <span>${m.genre}</span>
                        <span>${m.year}</span>
                    </div>
                    
                    <div class="ratings-row">
                        <span>IMDb: <span class="rating-imdb">★ ${m.imdb}</span></span>
                        <span>Mine: <span class="rating-my">${m.myrating}</span></span>
                    </div>

                    <div class="status-badge ${m.status === 'Watched' ? 'status-watched' : 'status-unwatched'}">
                        ${m.status.toUpperCase()}
                    </div>

                    <div class="card-actions">
                        ${m.watchUrl ? `<a href="${m.watchUrl}" target="_blank" class="btn-watch">▶ WATCH NOW</a>` : ''}
                        <div class="action-row">
                            <button class="btn-toggle" onclick="toggleStatus(${m.id})">
                                ${m.status === 'Watched' ? 'Unwatch' : 'Mark Watched'}
                            </button>
                            <button class="btn-edit" onclick="editMovie(${m.id})">✎ EDIT</button>
                            <button class="btn-del" onclick="deleteMovie(${m.id})">✕</button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Initial Load
    updateStats();
    renderMovies();
</script>

</body>
</html>
